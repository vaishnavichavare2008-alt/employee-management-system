<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Emloyee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    {% include 'emp/navbar.html' %}
    <h1 class="text-center my-3">Add New Emloyee</h1>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card bg-dark text-white">
                    <div class="card-body">
                   
                   <form action="/emp/add-emp/" method="POST">
                      {% csrf_token %}   
                    <div class="mb-3">
                           <label for="name">Employee Name</label>
                            <input id="name"type="text" class="form-control"plcaeholder="Enter emp name"
                            name="emp_name"/>

                        </div>
                    
                     <div class="mb-3">
                           <label for="id">Employee id</label>
                            <input id="id"type="text" class="form-control"plcaeholder="Enter emp id"
                            name="emp_id"/>
                        </div>
                    
                     <div class="mb-3">
                           <label for="phone">phone</label>
                            <input id="phone"type="text" class="form-control"plcaeholder="Enter emp phone"
                            name="emp_phone"/>
                        </div>
                    
                         <div class="mb-3">
                           <label for="address">Employee Address</label>
                            <textarea name="emp_address" id="address"  rows="5" class="form-control"plcaeholder="Enter emp Address">
                            </textarea>
                            </div>
                            <div class="mb-3 form-check">
                                <label for="working">Working</label>
                                <input id="working" name="emp_working" type="checkbox"class="form-check-input">
                            </div>

                            <div class="mb-3 ">
                                <label for="department">Departments</label>
                                <select name="emp_department" id="department" class="form-control">
                                    <option value="CSE">Computer Science</option>
                                    <option value="ME">Mechanical Engg</option>
                                    <option value="EE">Electrical Engg</option>
                                </select>
                           
                                </div>
                                <div class="container text-center">
                                    <button class="btn btn-primary">
                                        Add Emloyee
                                    </button>
                                </div>
                                        

                    </form>
                    </div>
                </div>

            </div>
        </div>
    </div>           
    "
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
