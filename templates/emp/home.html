<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    {% include 'emp/navbar.html' %}
    <h1 class="text-center my-3">Emloyee Management</h1>
    <h1 class="text-center my-3">List of Empployees</h1>
    
    <div class="container">
      <div class="row">
        <div class="col-md-12">

          <div class="card">
            <div class="card-body">

              <table class="table">
                <thead>
                  <tr>
                    <th>#SNO.</th>
                    <th>NAME</th>
                    <th>EMP ID</th>
                    <th>PHONE</th>
                    <th>Working</th>
                    <th>DEPARTMENT</th>
                    <th>Address</th>
                    <th>Action</th>

                  
                  </tr>
                </thead>
              <tbody>
                {% for e in emps %}
                <tr>
                  <td>{{forloop.counter}}</td>
                  <td>{{e.name}}</td>
                  <td>{{e.emp_id}}</td>
                  <td>{{e.phone}}</td>
                  <td>{{e.working}}</td>
                  <td>{{e.department}}</td>
                  <td>{{e.address}}</td>
                  <td>
                    <a href="/emp/delete-emp/{{e.id}}" class="btn btn-danger btn-sm">Delete</a>
                    <a href="/emp/update-emp/{{e.id}}" class="btn btn-dark btn-sm">Update</a>
                  </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>

            </div>

          </div>

        </div>
      </div>
    </div>

    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
