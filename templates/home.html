<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>

    <h1>Welcome {{ name }}</h1>

    <h2>Date and Time: {{ date }}</h2>

    <h3>Programs</h3>

    <ul>
        {% for program in list_of_programs %}
            <li>{{ program }}</li>
        {% endfor %}
    </ul>

    <h3>Student Details</h3>

    <p>Name: {{ student_data.student_name }}</p>
    <p>College: {{ student_data.student_collage }}</p>
    <p>City: {{ student_data.student_city }}</p>

</body>
</html>
